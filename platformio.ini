; Three boards share the code: the CYD (default), the Lilka v2 (pio run -e lilka) and the Waveshare AMOLED (pio run -e amoled).
; Pins and parts per board: src/board.h.
[platformio]
default_envs = cyd

[env:cyd]
platform = espressif32@8.0.0  ; pinned: the same toolchain here and on GitHub (checks.yml)
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.f_cpu = 240000000L
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
; LUA_32BITS: Lua with 32-bit integers and floats (the ESP32 FPU is single precision).
; LUAI_MAXCCALLS: bound Lua's C-stack depth (apps run in a small task stack).
build_flags =
    -O2
    -DTEEVEE_NO_WARP=1  ; board build: the turned face and the fisheye lens are left out (desktop and web keep them)
    -DTEEVEE_MIND_N=32  ; the board's mind net: 32 inner units (about 3k weights)
    -DCORE_DEBUG_LEVEL=0
    -DLUA_32BITS
    -DLUAI_MAXCCALLS=40

; Lilka v2: ESP32-S3, 16 MB flash, 8 MB PSRAM (octal), native USB (/dev/ttyACM0). Same firmware; board.h picks its pins.
; Sound is off on this board: the buzzer and amplifier pins are held low (src/main.cpp setup).
[env:lilka]
platform = espressif32@8.0.0  ; pinned: the same toolchain here and on GitHub (checks.yml)
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_16mb.csv
board_build.filesystem = littlefs
build_flags =
    -O2
    -DTEEVEE_BOARD_LILKA=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DTEEVEE_NO_WARP=1  ; (the turned face could come back here later: there is PSRAM for a full picture)
    -DTEEVEE_MIND_N=32
    -DCORE_DEBUG_LEVEL=0
    -DLUA_32BITS
    -DLUAI_MAXCCALLS=40

; Waveshare ESP32-S3-Touch-AMOLED-1.8: ESP32-S3, 16 MB flash, 8 MB PSRAM, native USB. Its own display driver (src/lcd_amoled.cpp)
; replaces the CYD/Lilka one (src/lcd.cpp); board.h has its pins. The face is drawn in the middle of the 368x448 panel.
[env:amoled]
platform = espressif32@8.0.0  ; pinned: the same toolchain here and on GitHub (checks.yml)
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_16mb.csv
board_build.filesystem = littlefs
src_filter = +<*> -<lcd.cpp>
build_flags =
    -O2
    -DTEEVEE_BOARD_AMOLED=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; (no TEEVEE_NO_WARP here: this board draws the turned head, driven by the motion sensor and the mind net together)
    -DTEEVEE_MIND_N=32
    -DCORE_DEBUG_LEVEL=0
    -DLUA_32BITS
    -DLUAI_MAXCCALLS=40
